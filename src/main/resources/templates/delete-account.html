<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellesley · Delete Account</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f7f6f2;color:#292621;padding:20px}
        .delete-box{width:100%;max-width:430px;background:#fff;border:1px solid #e4e0d9;border-radius:10px;padding:32px}
        .logo{text-align:center;font-size:22px;letter-spacing:3px;font-weight:600;margin-bottom:10px}
        .subtitle{text-align:center;color:#777;font-size:14px;line-height:1.5;margin-bottom:24px}
        .warning{background:#fff5f5;border:1px solid #edcccc;color:#a93636;padding:14px;border-radius:7px;font-size:13px;line-height:1.5;margin-bottom:23px}
        label{display:block;margin-bottom:7px;font-size:13px;font-weight:bold;color:#444}
        input{width:100%;padding:12px 13px;margin-bottom:18px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
        input:focus{border-color:#8b7457}
        .delete-button{width:100%;padding:12px;border:0;border-radius:6px;background:#a93636;color:#fff;font-size:14px;cursor:pointer}
        .delete-button:hover{background:#8e2d2d}
        .error{color:#a93636;text-align:center;margin-bottom:15px;font-size:13px}
        .back{text-align:center;margin-top:20px}
        .back a{color:#555;text-decoration:none;font-size:13px}
        .back a:hover{color:#222}
    </style>
</head>
<body>

<div class="delete-box">
    <div class="logo">THE WELLESLEY</div>

    <div class="subtitle">
        Are you sure you want to delete your account?
    </div>

    <div class="warning">
        This will permanently delete your account and booking history.
        This action cannot be undone.
    </div>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form action="/delete-account" method="post">
        <label for="password">Enter your password to confirm</label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit" class="delete-button">
            Permanently Delete Account
        </button>
    </form>

    <div class="back">
        <a href="/account">Cancel</a>
    </div>
</div>

</body>
</html>
