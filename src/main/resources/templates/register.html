<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellesley · Register</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f7f6f2;color:#292621;padding:20px}
        .register-box{width:100%;max-width:380px;background:#fff;border:1px solid #e4e0d9;border-radius:10px;padding:32px}
        .logo{text-align:center;font-size:22px;letter-spacing:3px;font-weight:600;margin-bottom:9px}
        .subtitle{text-align:center;color:#777;font-size:14px;line-height:1.5;margin-bottom:27px}
        label{display:block;margin-bottom:7px;font-size:13px;font-weight:bold;color:#444}
        input{width:100%;padding:12px 13px;margin-bottom:18px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
        input:focus{border-color:#8b7457}
        button{width:100%;padding:12px;border:0;border-radius:6px;background:#292621;color:#fff;font-size:14px;cursor:pointer}
        button:hover{background:#49443d}
        .login{text-align:center;margin-top:20px;color:#777;font-size:13px}
        .login a{color:#333;font-weight:bold;text-decoration:none}
        .error{color:#a93636;text-align:center;margin-bottom:15px;font-size:13px}
    </style>
</head>
<body>

<div class="register-box">
    <div class="logo">THE WELLESLEY</div>

    <div class="subtitle">
        Enter your email to create a new account.
    </div>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form action="/register" method="post">
        <label for="email">Email</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               required>

        <button type="submit">Continue</button>
    </form>

    <div class="login">
        Already have an account?
        <a href="/">Login</a>
    </div>
</div>

</body>
</html>
