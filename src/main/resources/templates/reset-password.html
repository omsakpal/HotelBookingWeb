<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wellesley · Reset Password</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#f7f6f2;color:#292621;padding:20px}
        .reset-box{width:100%;max-width:380px;background:#fff;border:1px solid #e4e0d9;border-radius:10px;padding:32px}
        .logo{text-align:center;font-size:22px;letter-spacing:3px;font-weight:600;margin-bottom:9px}
        .subtitle{text-align:center;color:#777;font-size:14px;line-height:1.5;margin-bottom:27px}
        label{display:block;margin-bottom:7px;font-size:13px;font-weight:bold;color:#444}
        input{width:100%;padding:12px 13px;margin-bottom:18px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none}
        input:focus{border-color:#8b7457}
        button{width:100%;padding:12px;border:0;border-radius:6px;background:#292621;color:#fff;font-size:14px;cursor:pointer}
        button:hover{background:#49443d}
        .error{color:#a93636;text-align:center;margin-bottom:15px;font-size:13px;line-height:1.5}
    </style>
</head>
<body>

<div class="reset-box">
    <div class="logo">THE WELLESLEY</div>

    <div class="subtitle">
        Create a new password for your account.
    </div>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form action="/reset-password" method="post">
        <label for="password">New Password</label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your new password"
               minlength="6"
               required>

        <label for="confirmPassword">Confirm Password</label>

        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               placeholder="Confirm your new password"
               minlength="6"
               required>

        <button type="submit">Reset Password</button>
    </form>
</div>

</body>
</html>
